name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verify formatting first; oxfmt covers JS/TS and the Markdown/MDX, CSS,
      # JSON, and YAML sources before the linters run.
      - name: Check formatting (oxfmt)
        run: pnpm run format:check

      # Type-aware lint via oxlint + oxlint-tsgolint (TypeScript native engine).
      - name: Lint JS/TS (oxlint)
        run: pnpm run lint

      - name: Type check (tsc)
        run: pnpm run typecheck

      - name: Unit tests (vitest)
        run: pnpm run test

      - name: Proofread Markdown/MDX (textlint)
        run: pnpm run lint:text

      # Renovate は CI の通過後に依存関係の更新を自動マージする。deploy.yml は main への
      # push 後にしかビルドしないため、マージ前にサイトがビルドできることを確かめる。
      - name: Build the site (astro build)
        run: pnpm run build
