name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verify formatting first; oxfmt covers JS/TS and the Markdown/MDX, CSS,
      # JSON, and YAML sources before the linters run.
      - name: Check formatting (oxfmt)
        run: pnpm run format:check

      # Type-aware lint via oxlint + oxlint-tsgolint (TypeScript native engine).
      - name: Lint JS/TS (oxlint)
        run: pnpm run lint

      - name: Type check (tsc)
        run: pnpm run typecheck

      - name: Unit tests (vitest)
        run: pnpm run test

      # 設計書の前提の列と、章のリンクの整合を確かめる。
      - name: Check the roadmap (dependencies and links)
        run: pnpm run roadmap:check

      - name: Proofread Markdown/MDX (textlint)
        run: pnpm run lint:text

      # Renovate は CI の通過後に依存関係の更新を自動マージする。deploy.yml は main への
      # push 後にしかビルドしないため、マージ前にサイトがビルドできることを確かめる。
      - name: Build the site (astro build)
        run: pnpm run build
